resolver 127.0.0.11 valid=10s ipv6=off;
upstream transaction_router {
    zone transaction_router 64k;
    server transaction-router:8080 resolve;
}
upstream visual_client {
    zone visual_client 64k;
    server frontend-service:80 resolve;
}
server {
    listen 80;
    server_name _;
    client_max_body_size 1m;

    location /api/ {
        proxy_pass http://transaction_router;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-Id $request_id;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    location = /health {
        proxy_pass http://transaction_router;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
    }

    location / {
        proxy_pass http://visual_client;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
