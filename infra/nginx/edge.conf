resolver 127.0.0.11 valid=10s ipv6=off;

# El ALB termina TLS y reenvía HTTP. Conservamos el esquema original para que
# el gateway valide Origin/HTTPS correctamente; en local no llega cabecera y
# se usa $scheme.
map $http_x_forwarded_proto $arepago_proto {
    default $scheme;
    "~*^https$" https;
    "~*^http$"  http;
    ""          $scheme;
}

# HSTS solo tiene sentido cuando el cliente llegó por HTTPS.
map $arepago_proto $arepago_hsts {
    default "max-age=31536000; includeSubDomains";
    http    "";
}

# En AWS el ALB está en una subred privada y añade la IP del cliente a
# X-Forwarded-For. Solo confiamos en proxies de rangos privados.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.1;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

upstream transaction_router {
    zone transaction_router 64k;
    server transaction-router:8080 resolve max_fails=3 fail_timeout=5s;
}
upstream visual_client {
    zone visual_client 64k;
    server frontend-service:80 resolve max_fails=3 fail_timeout=5s;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    proxy_next_upstream error timeout http_502 http_503 http_504;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Strict-Transport-Security $arepago_hsts always;
    proxy_hide_header X-Content-Type-Options;

    location /api/ {
        proxy_pass http://transaction_router;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $arepago_proto;
        proxy_set_header X-Request-Id $request_id;
        proxy_hide_header X-Powered-By;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    location = /health {
        proxy_pass http://transaction_router;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $arepago_proto;
        proxy_set_header X-Request-Id $request_id;
    }

    location = /health/detailed {
        proxy_pass http://transaction_router;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $arepago_proto;
        proxy_set_header X-Request-Id $request_id;
    }

    location = /metrics {
        proxy_pass http://transaction_router;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $arepago_proto;
        proxy_set_header X-Request-Id $request_id;
    }

    location / {
        proxy_pass http://visual_client;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $arepago_proto;
    }
}
