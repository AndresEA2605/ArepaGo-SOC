services:
  edge-alb:
    image: nginx:stable-alpine
    ports:
      - "8081:80"
    volumes:
      - ./infra/nginx/edge.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - transaction-router
      - frontend-service
    restart: unless-stopped

  frontend-service:
    image: nginx:stable-alpine
    volumes:
      - ./client:/usr/share/nginx/html:ro
    restart: unless-stopped

  transaction-router:
    build: .
    command: ["python", "-m", "services.gateway"]
    environment:
      PORT: "8080"
      TELEMETRY_URL: http://telemetry-service:8001
      INCIDENTS_URL: http://incident-service:8002
      VIEWS_URL: http://views-service:8003
      PEDIDOS_ALB_URL: http://pedidos-alb
      PAGOS_ALB_URL: http://pagos-alb
      CALIFICACIONES_ALB_URL: http://calificaciones-alb
      CATALOGO_ALB_URL: http://catalogo-alb
    depends_on:
      - telemetry-service
      - incident-service
      - views-service
      - pedidos-alb
      - pagos-alb
      - calificaciones-alb
      - catalogo-alb
    deploy:
      replicas: 2
    restart: unless-stopped

  pedidos-alb:
    image: nginx:stable-alpine
    volumes:
      - ./infra/nginx/pedidos.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - pedidos-service
    restart: unless-stopped
  pagos-alb:
    image: nginx:stable-alpine
    volumes:
      - ./infra/nginx/pagos.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - pagos-service
    restart: unless-stopped
  calificaciones-alb:
    image: nginx:stable-alpine
    volumes:
      - ./infra/nginx/calificaciones.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - calificaciones-service
    restart: unless-stopped
  catalogo-alb:
    image: nginx:stable-alpine
    volumes:
      - ./infra/nginx/catalogo.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - catalogo-service
    restart: unless-stopped

  pedidos-service:
    build: .
    command: ["python", "-m", "services.business"]
    environment: { SERVICE_NAME: pedidos, PORT: "8000" }
    deploy:
      replicas: 2
    restart: unless-stopped
  pagos-service:
    build: .
    command: ["python", "-m", "services.business"]
    environment: { SERVICE_NAME: pagos, PORT: "8000" }
    deploy:
      replicas: 2
    restart: unless-stopped
  calificaciones-service:
    build: .
    command: ["python", "-m", "services.business"]
    environment: { SERVICE_NAME: calificaciones, PORT: "8000" }
    deploy:
      replicas: 2
    restart: unless-stopped
  catalogo-service:
    build: .
    command: ["python", "-m", "services.business"]
    environment: { SERVICE_NAME: catalogo, PORT: "8000" }
    deploy:
      replicas: 2
    restart: unless-stopped

  telemetry-service:
    build: .
    command: ["python", "-m", "services.telemetry"]
    environment: &postgres_app_env
      PORT: "8001"
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-arepagosoc}
      DB_USER: ${DB_USER:-arepagosoc_app}
      DB_PASSWORD_FILE: /run/secrets/db_password
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      DB_SSLROOTCERT: ${DB_SSLROOTCERT:-}
      DB_POOL_MIN_SIZE: ${DB_POOL_MIN_SIZE:-1}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-5}
      DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-10}
    secrets:
      - db_password
    restart: unless-stopped

  incident-service:
    build: .
    command: ["python", "-m", "services.incidents"]
    environment:
      <<: *postgres_app_env
      PORT: "8002"
      LATENCY_THRESHOLD_MS: "1000"
      ERROR_RATE_THRESHOLD: "0.20"
      POOL_WARNING_RATIO: "0.75"
    secrets:
      - db_password
    restart: unless-stopped

  views-service:
    build: .
    command: ["python", "-m", "services.views"]
    environment:
      PORT: "8003"
      TELEMETRY_URL: http://telemetry-service:8001
      INCIDENTS_URL: http://incident-service:8002
    depends_on:
      - telemetry-service
      - incident-service
    restart: unless-stopped

  postgres:
    image: postgres:18.6-alpine
    profiles: ["local"]
    environment:
      POSTGRES_DB: ${DB_NAME:-arepagosoc}
      POSTGRES_USER: ${DB_USER:-arepagosoc_app}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  postgres-data:

secrets:
  db_password:
    file: ./secrets/db_password.txt
