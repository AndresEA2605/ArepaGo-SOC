resolver 127.0.0.11 valid=10s ipv6=off;
upstream calificaciones_targets { zone calificaciones_targets 64k; server calificaciones-service:8000 resolve; }
server { listen 80; location / { proxy_pass http://calificaciones_targets; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; } }
